<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-label="Jean-Paul ADOGLI, ingénieur IA et Big Data">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="trait" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="270" fill="url(#fond)"/>

  <g fill="none" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1.5">
    <path d="M0 215 C 150 160, 260 250, 420 195 S 700 150, 820 205 S 1060 250, 1200 170"/>
    <path d="M0 235 C 170 190, 300 260, 470 215 S 740 175, 870 225 S 1090 262, 1200 195"/>
  </g>
  <g fill="#38bdf8" fill-opacity="0.35">
    <circle cx="95" cy="48" r="3"/><circle cx="210" cy="92" r="2.5"/><circle cx="330" cy="40" r="2"/>
    <circle cx="905" cy="55" r="3"/><circle cx="1010" cy="100" r="2.5"/><circle cx="1110" cy="46" r="2"/>
  </g>

  <text x="600" y="108" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff" letter-spacing="1">Jean-Paul ADOGLI</text>
  <text x="600" y="148" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="500" fill="#38bdf8" letter-spacing="3">INGÉNIEUR IA &amp; BIG DATA</text>
  <rect x="470" y="168" width="260" height="2" fill="url(#trait)"/>

  <g font-family="'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="21" fill="#e2e8f0" text-anchor="middle">
    <text x="600" y="214" opacity="0">
      Je construis des systèmes qui vont de la donnée à la décision
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.03;0.30;0.33;1" values="0;1;1;0;0"/>
    </text>
    <text x="600" y="214" opacity="0">
      Pipelines Kafka et Spark, modèles exposés par API
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.33;0.36;0.63;0.66;1" values="0;0;1;1;0;0"/>
    </text>
    <text x="600" y="214" opacity="0">
      Agents LLM, RAG et supervision Prometheus et Grafana
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.66;0.69;0.96;0.99;1" values="0;0;1;1;0;0"/>
    </text>
  </g>
</svg>
