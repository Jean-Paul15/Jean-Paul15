name: Carte d'activité

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate_activity.py

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer la carte
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: python scripts/generate_activity.py

      - name: Enregistrer si la carte a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git diff --cached --quiet || (git commit -m "chore: carte d'activité" && git push)
